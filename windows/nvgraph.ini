; nvgraph GPU policy
; Matching is case-insensitive against the model name reported by nvidia-smi.
; Edit this file while nvgraph is running: it is reloaded on every sample.
; A power_limit_w value of 0 uses the limit currently reported by nvidia-smi.

[defaults]
power_limit_w = 0
temperature_warning_c = 80
temperature_critical_c = 90

[gpu:Tesla M40]
power_limit_w = 180
temperature_warning_c = 80
temperature_critical_c = 88

[gpu:Tesla M40 24GB]
power_limit_w = 180
temperature_warning_c = 80
temperature_critical_c = 88

[gpu:Tesla P40]
power_limit_w = 250
temperature_warning_c = 80
temperature_critical_c = 89

[gpu:Tesla P100-PCIE-16GB]
power_limit_w = 250
temperature_warning_c = 75
temperature_critical_c = 80

[gpu:NVIDIA GeForce RTX 3090]
power_limit_w = 370
temperature_warning_c = 80
temperature_critical_c = 90

[gpu:NVIDIA GeForce RTX 4090]
power_limit_w = 450
temperature_warning_c = 80
temperature_critical_c = 90
